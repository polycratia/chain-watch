[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chain-watch"
version = "0.1.0"
description = "Track deposits and confirmations: follow addresses, count confirmations, survive reorgs, and notify once and only once."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
maintainers = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["blockchain", "deposits", "confirmations", "reorg", "notifications"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://polycratia.com"
Repository = "https://github.com/polycratia/chain-watch"
Issues = "https://github.com/polycratia/chain-watch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chain_watch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
